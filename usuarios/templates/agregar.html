{% extends 'base.html' %}

{% load static %}

{% block title %}
Registrar Alumno
{% endblock %}

{% block content %}

<div class="content-header">

    <h1>Registrar Alumno</h1>

    <div class="buttons">

        <button type="submit" form="formAlumno" class="btn-save">
            <i class="fa-solid fa-floppy-disk"></i>
            Guardar
        </button>

        <a href="/alumnos/" class="btn-update" style="text-decoration:none; display:flex; align-items:center;">
            <i class="fa-solid fa-table" style="margin-right:8px;"></i>
            Consultar
        </a>

    </div>

</div>

<form id="formAlumno" class="employee-form" method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <div class="form-container">

        <!-- FOTO -->

        <div class="credential-preview">

            <p style="margin-bottom:20px;"><strong>Fotografía del alumno</strong></p>

            <img src="{% static 'img/user.png' %}" alt="Alumno">

            <br><br>

            <input
                type="file"
                name="foto"
                accept="image/*">

        </div>

        <!-- CAMPOS -->

        <div style="flex:1;">

            <div class="form-grid">

                <div class="input-group">

                    <label>Nombre</label>

                    <input
                        type="text"
                        name="nombre"
                        placeholder="Nombre del alumno"
                        required>

                </div>

                <div class="input-group">

                    <label>Apellido paterno</label>

                    <input
                        type="text"
                        name="apellido_paterno"
                        placeholder="Apellido paterno"
                        required>

                </div>

                <div class="input-group">

                    <label>Apellido materno</label>

                    <input
                        type="text"
                        name="apellido_materno"
                        placeholder="Apellido materno"
                        required>

                </div>

                <div class="input-group">

                    <label>Correo electrónico</label>

                    <input
                        type="email"
                        name="correo"
                        placeholder="correo@ejemplo.com"
                        required>

                </div>

                <div class="input-group">

                    <label>Teléfono</label>

                    <input
                        type="text"
                        name="telefono"
                        placeholder="4431234567"
                        required>

                </div>

                <div class="input-group">

                    <label>Fecha de nacimiento</label>

                    <input
                        type="date"
                        name="fecha_nacimiento"
                        required>

                </div>

                <div class="input-group">

                    <label>Nombre del tutor</label>

                    <input
                        type="text"
                        name="tutor_nombre"
                        placeholder="Tutor">

                </div>

                <div class="input-group">

                    <label>Teléfono del tutor</label>

                    <input
                        type="text"
                        name="tutor_telefono"
                        placeholder="4431234567">

                </div>

                <div class="input-group">

                    <label>Categoría</label>

                    <select
                        name="categoria"
                        required>

                        <option disabled selected>
                            Seleccione una categoría
                        </option>

                        {% for categoria in categorias %}

                        <option value="{{ categoria.id }}">

                            {{ categoria.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="input-group">

                    <label>Status</label>

                    <select name="status">

                        <option value="True" selected>
                            Activo
                        </option>

                        <option value="False">
                            Inactivo
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </div>

</form>

{% endblock %}
