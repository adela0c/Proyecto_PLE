{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #f2f2f2;
        }

        /* TOPBAR */

        .topbar{
            width: 100%;
            background-color: #009688;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
        }

        /* CONTENEDOR */

        .contenedor{
            width: 100%;
            height: calc(100vh - 60px);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box{
            width: 400px;
            text-align: center;
        }

        /* LOGO */

        .logo img{
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 3px solid #009688;
            padding: 10px;
            background-color: white;
            margin-bottom: 40px;
        }

        h2{
            color: #1f355e;
            margin-bottom: 40px;
        }

        /* INPUTS */

        .input-group{
            margin-bottom: 20px;
        }

        .input-group input{
            width: 100%;
            padding: 14px;
            border: none;
            background-color: #dcefed;
            outline: none;
            font-size: 15px;
        }

        /* BOTON */

        .btn-login{
            width: 70%;
            padding: 12px;
            border: none;
            background-color: #009688;
            color: white;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: .3s;
        }

        .btn-login:hover{
            background-color: #00796b;
        }

    </style>

</head>
<body>

    <!-- TOPBAR -->

    <div class="topbar">
        LENGUAS EXTRANJERAS
    </div>

    <!-- LOGIN -->

    <div class="contenedor">

        <div class="login-box">

            <!-- LOGO -->

            <div class="logo">

                 <img src="{% static 'img/logo_ut.png' %}" alt="">

            </div>

            <h2>INGRESAR</h2>

            <!-- FORMULARIO -->

            <form>

                <div class="input-group">
                    <input type="text" placeholder="Usuario">
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Contraseña">
                </div>

                <button type="submit" class="btn-login">
                    Ingresar
                </button>

            </form>

        </div>

    </div>

</body>
</html>
