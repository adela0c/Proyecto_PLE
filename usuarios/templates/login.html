{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .topbar{
            width:100%;
            height:60px;
            background:#009688;
            display:flex;
            align-items:center;
            padding:0 25px;
            color:white;
            font-size:18px;
            font-weight:bold;
        }

        .contenedor{

            width:100%;
            height:calc(100vh - 60px);

            display:flex;
            justify-content:center;
            align-items:center;

        }

        .login-box{

            width:420px;

            background:white;

            padding:40px;

            border-radius:10px;

            box-shadow:0 3px 10px rgba(0,0,0,.15);

            text-align:center;

        }

        .logo img{

            width:160px;

            margin-bottom:25px;

        }

        h2{

            color:#1f355e;

            margin-bottom:35px;

        }

        .input-group{

            display:flex;

            flex-direction:column;

            margin-bottom:20px;

            text-align:left;

        }

        .input-group label{

            margin-bottom:6px;

            font-size:14px;

            font-weight:bold;

        }

        .input-group input{

            padding:12px;

            border:1px solid #ccc;

            border-radius:5px;

            outline:none;

        }

        .btn-login{

            width:100%;

            padding:14px;

            border:none;

            background:#009688;

            color:white;

            border-radius:5px;

            cursor:pointer;

            transition:.3s;

            font-size:15px;

        }

        .btn-login:hover{

            background:#00796b;

        }

        .error{

            background:#ffebee;

            color:#c62828;

            padding:10px;

            border-radius:5px;

            margin-bottom:20px;

        }

    </style>

</head>

<body>

<div class="topbar">

    LENGUAS EXTRANJERAS

</div>

<div class="contenedor">

    <div class="login-box">

        <div class="logo">

            <img src="{% static 'img/logo_ut.png' %}" alt="Logo">

        </div>

        <h2>INICIAR SESIÓN</h2>

        {% if messages %}

            {% for message in messages %}

                <div class="error">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">

                <label>Usuario</label>

                <input
                    type="text"
                    name="username"
                    required>

            </div>

            <div class="input-group">

                <label>Contraseña</label>

                <input
                    type="password"
                    name="password"
                    required>

            </div>

            <button
                type="submit"
                class="btn-login">

                Ingresar

            </button>

        </form>

    </div>

</div>

</body>

</html>
