{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calificaciones</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <h2>LENGUAS EXTRANJERAS</h2>

        <div class="user-section">
            <img src="{% static 'img/user.png' %}" alt="">

            <div>
                <p>Sesión iniciada con:</p>
                <span>Alumno</span>
            </div>

            <i class="fa-solid fa-right-from-bracket logout-icon"></i>
        </div>
    </header>

    <!-- CONTENEDOR -->
    <div class="main-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <img src="{% static 'img/logo_ut.png' %}" class="logo">

            <nav>

                <a href="/inicio/">
                    <i class="fa-solid fa-house"></i>
                    Inicio
                </a>

                <a href="/niveles/">
                    <i class="fa-solid fa-book"></i>
                    Cursos
                </a>

            </nav>

        </aside>

        <!-- CONTENIDO -->
        <main class="content">

            <h1 class="page-title">
                Calificaciones
            </h1>

            <div class="parciales-grid">

                <!-- PARCIAL 1 -->
                <div class="parcial-card">

                    <div class="parcial-header">
                        <i class="fa-solid fa-file-lines"></i>
                        <h2>Parcial 1</h2>
                    </div>

                    <div class="curso-info">
                        <span>Curso</span>
                        <h3>Intermedio 1</h3>
                    </div>

                    <div class="nota-circular">
                        95
                    </div>

                    <div class="nota-info">
                        <span>Calificación obtenida</span>
                    </div>

                </div>

                <!-- PARCIAL 2 -->
                <div class="parcial-card">

                    <div class="parcial-header">
                        <i class="fa-solid fa-file-lines"></i>
                        <h2>Parcial 2</h2>
                    </div>

                    <div class="curso-info">
                        <span>Curso</span>
                        <h3>Intermedio 1</h3>
                    </div>

                    <div class="nota-circular">
                        88
                    </div>

                    <div class="nota-info">
                        <span>Calificación obtenida</span>
                    </div>

                </div>

                <!-- PARCIAL 3 -->
                <div class="parcial-card">

                    <div class="parcial-header">
                        <i class="fa-solid fa-file-lines"></i>
                        <h2>Parcial 3</h2>
                    </div>

                    <div class="curso-info">
                        <span>Curso</span>
                        <h3>Intermedio 1</h3>
                    </div>

                    <div class="nota-circular">
                        100
                    </div>

                    <div class="nota-info">
                        <span>Calificación obtenida</span>
                    </div>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
