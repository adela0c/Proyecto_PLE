{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Subir Archivo</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- TOPBAR -->
    <header class="topbar">

        <h2>LENGUAS EXTRANJERAS</h2>

        <div class="user-section">

            <img src="{% static 'img/user.png' %}" alt="">

            <div>
                <p>Sesión iniciada con:</p>
                <span>Usuario 1</span>
            </div>

            <i class="fa-solid fa-right-from-bracket logout-icon"></i>

        </div>

    </header>

    <!-- MAIN -->
    <div class="main-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <img src="{% static 'img/logo_ut.png' %}" class="logo">

            <nav>

                <a href="/inicio/">
                    <i class="fa-solid fa-house"></i>
                    Inicio
                </a>

                <a href="/alumnos/">
                    <i class="fa-solid fa-user"></i>
                    Consultar Colaboradores
                </a>

                <a href="/agregar/">
                    <i class="fa-solid fa-users"></i>
                    Información Alumno
                </a>

            </nav>

        </aside>

        <!-- CONTENIDO -->
        <main class="content upload-content">

            <h1>Subir Archivo</h1>

            <p class="upload-text">
                Sube el PDF de tu pago realizado.
            </p>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="upload-box">

                    <i class="fa-solid fa-cloud-arrow-up upload-cloud"></i>

                    <!-- Input oculto -->
                    <input
                        type="file"
                        id="archivo"
                        name="archivo"
                        accept=".pdf"
                        hidden
                    >

                    <!-- Botón para seleccionar archivo -->
                    <button
                        type="button"
                        id="btnSeleccionar"
                        class="upload-btn"
                    >
                        Seleccionar archivo
                    </button>

                    <!-- Nombre del archivo -->
                    <p
                        id="nombreArchivo"
                        style="display:none; margin-top:15px;"
                    ></p>

                    <!-- Botón para subir -->
                    <button
                        type="submit"
                        id="btnSubir"
                        class="upload-btn"
                        style="display:none; margin-top:15px;"
                    >
                        Subir
                    </button>

                </div>

            </form>

        </main>

    </div>

    <script>

        const archivo = document.getElementById('archivo');
        const btnSeleccionar = document.getElementById('btnSeleccionar');
        const btnSubir = document.getElementById('btnSubir');
        const nombreArchivo = document.getElementById('nombreArchivo');

        btnSeleccionar.addEventListener('click', () => {
            archivo.click();
        });

        archivo.addEventListener('change', function () {

            if (this.files.length > 0) {

                nombreArchivo.textContent = '📄 ' + this.files[0].name;

                btnSeleccionar.style.display = 'none';
                nombreArchivo.style.display = 'block';
                btnSubir.style.display = 'inline-block';
            }

        });

    </script>

</body>

</html>
